name: bounty board

# Everything this workflow does can be reproduced locally:
#   npm run bounty -- validate
#   npm run rep -- audit
# The jobs contain no logic of their own — they only call the CLIs.

on:
  pull_request:
    paths:
      - 'bounty-board/**'
      - 'scripts/bounty.mjs'
      - 'scripts/reputation.mjs'
      - 'scripts/lib/bounty.mjs'
  push:
    branches: [main]
  schedule:
    # Nightly expiry + audit, 04:17 UTC.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Anything that writes shares one group so two merges can't corrupt the ledger.
  group: bounty-board-${{ github.event_name == 'pull_request' && github.ref || 'write' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- validate
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate bounties
        run: node scripts/bounty.mjs validate

      - name: Audit ledger format
        run: node scripts/reputation.mjs audit

      - name: Contributors may not write the ledger or profiles
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"

          # The ledger is workflow-written. A maintainer appending a manual or
          # correction event applies the 'ledger-override' label to bypass this,
          # which per GOVERNANCE.md needs a second maintainer's approval.
          if echo "$CHANGED" | grep -q '^bounty-board/reputation/ledger/.*\.jsonl$'; then
            if [ "${{ contains(github.event.pull_request.labels.*.name, 'ledger-override') }}" != "true" ]; then
              echo "::error::This PR edits the reputation ledger. Ledger lines are written by CI on merge."
              echo "::error::Maintainers appending a manual or correction event must apply the 'ledger-override' label."
              exit 1
            fi
          fi

          # Generated profiles are derived; nobody edits them by hand.
          if echo "$CHANGED" | grep -qE '^bounty-board/reputation/profiles/[^_][^/]*\.json$'; then
            echo "::error::Profiles are generated by \`npm run rep -- rebuild\`. Edit reputation/profiles/_overrides/<handle>.json instead."
            exit 1
          fi

      - name: Generated artifacts are up to date
        run: |
          node scripts/bounty.mjs index
          node scripts/reputation.mjs rebuild
          node scripts/reputation.mjs leaderboard
          if ! git diff --quiet; then
            echo "::error::Generated files are stale. Run: npm run bounty -- index && npm run rep -- rebuild && npm run rep -- leaderboard"
            git --no-pager diff --stat
            exit 1
          fi

  # ------------------------------------------------------------------- award
  award:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Complete bounties referenced by the merge commit
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.username }}
          SHA: ${{ github.sha }}
        run: |
          IDS="$(printf '%s' "$MESSAGE" | grep -oE '(Closes|Resolves|Bounty:) *FB-[0-9]{4}' | grep -oE 'FB-[0-9]{4}' | sort -u || true)"
          if [ -z "$IDS" ]; then
            echo "No bounty references in the merge commit. Nothing to award."
            exit 0
          fi
          for ID in $IDS; do
            echo "::group::$ID"
            node scripts/bounty.mjs complete "$ID" --who "$AUTHOR" --commit "$SHA" || true
            node scripts/reputation.mjs award \
              --who "$AUTHOR" \
              --event bounty.completed \
              --ref "$ID" \
              --actor "github-actions[bot]" \
              --source workflow \
              --reason "Merged in $SHA." || true
            echo "::endgroup::"
          done

      - name: Regenerate derived artifacts
        run: |
          node scripts/bounty.mjs index
          node scripts/reputation.mjs rebuild
          node scripts/reputation.mjs leaderboard

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bounty-board/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(bounty): award REP and regenerate board artifacts [skip organize]"
            git push
          fi

  # ------------------------------------------------------------------ expire
  expire:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Implemented by FB-0901. Until that lands this is a no-op dry run that
      # reports what a sweep would do, so the schedule is proven before it bites.
      - name: Sweep lapsed claims (dry run until FB-0901 lands)
        run: |
          if node scripts/bounty.mjs sweep --dry-run 2>/dev/null; then
            echo "Sweep available."
          else
            echo "::notice::\`bounty sweep\` is not implemented yet — see FB-0901."
          fi

  # ------------------------------------------------------------------- audit
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reputation integrity and anti-gaming audit
        run: node scripts/reputation.mjs audit
